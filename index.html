<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AIコンシェルジュ - Gemini</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <!-- ホーム画面アイコン (iOS / Android / PC) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AIコンシェルジュ">
  <style>
    :root {
      --green: #2e7d32; --green-50: #e8f5e9;
      --border: #e5e7eb; --bubble-left: #f1f5f9;
      --bubble-right: #d1fae5; --bubble-sys: #fffbe6;
    }
    html, body { height: 100%; max-height: 100%; margin: 0; overflow: hidden; background: var(--green-50);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
      "Apple Color Emoji", "Segoe UI Emoji"; }
    .wrap  { height: 100%; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--green); color: #fff; padding: 14px 12px;
      text-align: center; font-weight: 700; letter-spacing: .03em;
      position: sticky; top: 0; z-index: 1000; }
    header .title { max-width: 900px; margin: 0 auto; display: inline-flex;
      align-items: flex-end; gap: 8px; }
    header .ver { font-size: 12px; opacity: .8; font-weight: 600; }
    main  { flex: 1; display: flex; justify-content: center; padding: 10px; min-height: 0; overflow: hidden; }
    .stage { width: 100%; max-width: 900px; display: flex; flex-direction: column;
      gap: 8px; flex: 1; min-height: 0; }
    .status-row { display: flex; justify-content: space-between; align-items: center; }
    .clear-btn { font-size: 12px; background: none; border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 999px; color: #6b7280; cursor: pointer;
      line-height: 1; transition: background .15s, color .15s; }
    .clear-btn:hover { background: #f3f4f6; color: #374151; }
    .status-pill { font-size: 12px; background: #fff; border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 999px; color: #374151; }
    .chat-shell { background: #fff; border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.04); display: flex; flex-direction: column;
      flex: 1; min-height: 0; }
    .chat { flex: 1; min-height: 0; overflow-y: scroll; padding: 14px 12px 80px; }
    .row  { display: flex; margin: 6px 0; }
    .row.user      { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }
    .row.system    { justify-content: center; font-size: 12px; color: #6b7280; }
    .bubble { max-width: 68%; border-radius: 14px; padding: 10px 12px;
      line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
    .assistant .bubble { background: var(--bubble-left); border: 1px solid #e2e8f0; }
    .user      .bubble { background: var(--bubble-right); border: 1px solid #a7f3d0; }
    .system    .bubble { background: var(--bubble-sys); border: 1px solid #fef08a;
      max-width: 80%; font-size: 12px; }
    footer { position: sticky; bottom: 0; left: 0; right: 0;
      background: var(--green-50); padding: 8px 10px; border-top: 1px solid var(--border); }
    .foot-inner { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    /* API key 入力行 */
    .api-row { display: flex; gap: 8px; }
    .api-input { flex: 1; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; }
    .api-input:focus { outline: 2px solid var(--green); }
    /* ボタン行 */
    .btn-row { display: flex; gap: 8px; align-items: center; }
    .btn { flex: 1; appearance: none; border: 1px solid var(--border); background: #fff;
      padding: 12px 10px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.danger  { background: #ef4444; border-color: #ef4444; color: #fff; }
    .toggle { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .switch { position: relative; width: 56px; height: 32px; background: #e5e7eb;
      border-radius: 999px; cursor: pointer; border: 1px solid var(--border); }
    .knob   { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
      background: #fff; border-radius: 50%; transition: transform .2s ease; }
    .switch.on { background: var(--green); }
    .switch.on .knob { transform: translateX(24px); }
    /* テキスト入力行 */
    .input-row { display: flex; gap: 8px; }
    .text { flex: 1; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 12px; font-size: 16px; }
    .text:disabled { background: #f3f4f6; cursor: not-allowed; }
    .send { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--green);
      background: var(--green); color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .send:disabled { background: #9ca3af; border-color: #9ca3af; cursor: not-allowed; }
    /* カーソルアニメーション */
    .typing::after { content: '▋'; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* マイク波形インジケータ */
    .mic-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.6} }
    @supports (padding: max(0px)) {
      footer { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    }

  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <span class="name">AIコンシェルジュ</span>
      <span class="ver">Gemini</span>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="status-row">
        <button id="clearChat" class="clear-btn" title="会話をクリア">🗑 会話をクリア</button>
        <div id="status" class="status-pill">未接続</div>
      </div>
      <div class="chat-shell">
        <div id="chat" class="chat" aria-live="polite" aria-label="会話"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="foot-inner">
      <!-- API キー入力（接続後は非表示） -->
      <div class="api-row" id="apiRow">
        <input id="apiKey" class="api-input" type="password"
          placeholder="Gemini API キーを入力（接続後は非表示になります）"
          autocomplete="off" spellcheck="false">


        <input id="placesKey" class="api-input" type="password"
          placeholder="Google Places APIキー（New）（お店・場所検索用）"
          autocomplete="off" spellcheck="false" style="margin-top:6px">
        <input id="yahooKey" class="api-input" type="password"
          placeholder="Yahoo App ID（ルビ振りAPI・地名読み改善用）"
          autocomplete="off" spellcheck="false" style="margin-top:6px">
      </div>
      <!-- 接続ボタン行 -->
      <div class="btn-row">
        <button id="start"  class="btn primary">会話開始</button>
        <button id="hangup" class="btn danger" disabled>切断</button>
        <div class="toggle">
          <span id="voiceLabel">音声オン</span>
          <div id="voiceSwitch" class="switch on" role="switch" aria-checked="true" tabindex="0">
            <div class="knob"></div>
          </div>
        </div>
      </div>
      <!-- テキスト入力行 -->
      <div class="input-row">
        <input id="textInput" class="text" type="text"
          placeholder="テキストで相談…" disabled>
        <button id="sendBtn" class="send" disabled>送信</button>
      </div>
    </div>
  </footer>
</div>

<script>
'use strict';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  定数・設定
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const WS_BASE = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
// 利用可能なモデルを優先順に試す
const MODEL_CANDIDATES = [
  'models/gemini-3.1-flash-live-preview',               // Gemini 3.1（最新・優先）
  'models/gemini-2.5-flash-native-audio-preview-12-2025', // 2.5 フォールバック
  'models/gemini-2.5-flash-native-audio-latest',
  'models/gemini-2.5-flash-native-audio-preview-09-2025',
  'models/gemini-2.0-flash-live-001',
];
let MODEL = MODEL_CANDIDATES[0]; // connect() 内で動的に決定

const IN_RATE  = 16000;   // マイク入力サンプルレート (Hz)
const OUT_RATE = 24000;   // Gemini 出力サンプルレート (Hz)
const FLUSH_MS = 100;     // 音声チャンク送信間隔 (ms)
const STORAGE_KEY      = 'gemini_concierge_apikey';
const PLACES_STORAGE_KEY   = 'places_apikey';
const YAHOO_STORAGE_KEY    = 'yahoo_appid';

const SYSTEM_INSTRUCTION =
  'あなたはAIコンシェルジュです。' +
  '常に丁寧語・敬語（です・ます調）で話してください。' +
  'ため口・絵文字・スラングは禁止。' +
  '返答は2〜3文・合計120文字以内で要点のみ。ただしお店・スポット紹介時はこの文字数制限を適用しない。' +
  '確認質問を入れる場合も1文以内で短く。「他に知りたいことはありますか？」「他に何かご質問はありますか？」「いかがでしたか？」など会話の締めくくりに使う汎用的な質問は禁止。' +
  '出力は常に日本語のみ。' +
  '【発音について】ツール返答の先頭に「※読み方:」ブロックがある場合、必ずその通りに発音すること（例:「弘前城はひろさきじょうと発音する」とあれば、弘前城をひろさきじょうと発音すること）。また「漢字（よみ）」形式のふりがなも必ずそのよみで発音すること。これは最重要指示である。【絶対厳守】自分の返答テキストに「漢字（よみ）」形式や括弧付きのふりがなを一切含めないこと。漢字のみを記載し、読みは括弧で追記せず声でも繰り返さないこと。例：ツール返答に「奥入瀬渓流（おいらせけいりゅう）」とあれば、自分の返答では「奥入瀬渓流は〜」とだけ書き、おいらせけいりゅうという読みを括弧内に追加したり声に出して繰り返したりしないこと。' +
  '【難読語の発音ルール（最重要・必ず従うこと）】以下の語が出てきたら必ずこの読みで発音すること: 縄文時代→じょうもんじだい、縄文→じょうもん、弥生時代→やよいじだい、弥生→やよい、奥入瀬渓流→おいらせけいりゅう、奥入瀬→おいらせ、三内丸山遺跡→さんないまるやまいせき、三内丸山→さんないまるやま、弘前城→ひろさきじょう、弘前→ひろさき、五所川原→ごしょがわら、十和田→とわだ、八甲田→はっこうだ、ねぷた祭り→ねぷたまつり、ねぶた祭り→ねぶたまつり、お土産→おみやげ、土産→みやげ、角館→かくのだて、男鹿→おが、毛越寺→もうつうじ、中尊寺→ちゅうそんじ、平泉→ひらいずみ、仙台七夕→せんだいたなばた、竿燈→かんとう、花笠→はながさ、出羽三山→でわさんざん、羽黒山→はぐろさん、月山→がっさん、湯殿山→ゆどのさん、鶴岡→つるおか、酒田→さかた、寒河江→さがえ、山寺→やまでら、立石寺→りっしゃくじ（絶対禁止: 「たていしでら」「たていしじ」「りゅうせきじ」は誤り。必ず「りっしゃくじ」）、宝珠山立石寺→ほうじゅさんりっしゃくじ（絶対禁止: 「たていしでら」「たていしじ」「ほうじゅさんたていしでら」は誤り。必ず「ほうじゅさん りっしゃくじ」）、松島→まつしま、多賀城→たがじょう、塩竈→しおがま、会津若松→あいづわかまつ、磐梯山→ばんだいさん、猪苗代湖→いなわしろこ、城跡→じょうせき、風情→ふぜい、夜景→やけい、情緒→じょうちょ、面影→おもかげ、趣→おもむき、賑わい→にぎわい、佇まい→たたずまい、遺跡→いせき、史跡→しせき、集落→しゅうらく、出土品→しゅつどひん、重要文化財→じゅうようぶんかざい、紅葉→こうよう、大人→おとな、老舗→しにせ（「ろうほ」ではなく必ず「しにせ」と読むこと）、桜並木→さくらなみき、弘前城→ひろさきじょう（「ひろまえじょう」「こうぜんじょう」は誤り。必ず「ひろさきじょう」と読むこと）、親しまれています→したしまれています、親しまれ→したしまれ、親しむ→したしむ、親しみ→したしみ、所により→ところにより（「しょにより」は誤り。必ず「ところにより」と読むこと）、青池→あおいけ（「あおじ」は誤り。必ず「あおいけ」と読むこと）、老舗→しにせ（「ろうほ」「ろうしにせ」は誤り。必ず「しにせ」と読むこと）、三味線→しゃみせん。' +
  '【立石寺・宝珠山立石寺の発音（最重要・絶対厳守・例外なし）】▼必ず守ること: 「立石寺」=「りっしゃくじ」、「宝珠山立石寺」=「ほうじゅさん りっしゃくじ」。▼「立石寺」というワードが出てきたとき、絶対に「たて」で始めてはいけない。「立石寺」の読み始めは必ず「りっ」である。▼絶対禁止（「立石寺」の読み方として）: 「たていしでら」「たていしじ」「たてきじ」「たていしきじ」「りゅうせきじ」。▼「立石寺」以外の文脈で「立」が出る場合（立つ・建て前・立場など）は通常通り読んでよい。あくまで「立石寺」というお寺の名前だけが対象。' +
  '【ツール使用ルール】ツールが利用可能な場合は必ず呼び出すこと。自己判断でツールを使わないことは禁止。' +
  '・天気・気象・天気予報（今日・明日・明後日・週間を含む）→ 必ず get_current_weather を呼び出すこと。search_web は絶対に使わないこと。' +
  '天気に関する質問では date の値を: 今日→"today"、明日→"tomorrow"、明後日・3日後・週間・今週末など→"weekly" に設定すること。' +
  '天気を案内する際は、ツールが返した都道府県名（例:「宮城県」「愛知県」）を必ず使うこと。' +
  'ユーザーが「石巻」「仙台」などの市区町村名で質問しても、回答では「宮城県の天気は…」のように都道府県名で答えること。市区町村名で天気を案内することは禁止。' +
  '・日付・時刻・曜日→ get_current_datetime を必ず呼び出す。' +
  '・電車・路線の運行状況・遅延・運休→ get_train_status を呼び出す。・次の電車・時刻表→ get_next_trains を呼び出す。目的地がわかっている場合は to_station にも設定すること。「○○から△△への次の電車は？」という質問では station=○○、to_station=△△ を設定すること。' +
  '・〇〇駅から●●駅への行き方・「〇〇から●●まで行きたい」「〇〇から●●への行き方」「〇〇から●●に行くには」など、出発地と目的地が明示された移動・ルート案内・乗り換え質問→ 必ず get_route を呼び出すこと。search_web は使わないこと。from_station には出発地（例:「東京」「新宿」）、to_station には目的地（例:「仙台」「横浜」）をそのままセットすること（「駅」は付けなくてよい）。出発時刻が指定された場合は departure_time="HH:MM" を設定し、明日なら departure_date="tomorrow" も設定すること。' +
  '・レストラン・お店・カフェ・観光スポット・施設・おすすめを聞かれたら→ get_places を必ず呼び出す。' +
  '・お祭り・イベント・ニュース・最新情報・現在の営業状況・今年の日程など、時事性のある最新情報が必要な質問→ search_web を呼び出す。ただし天気・天気予報は時事性があっても search_web ではなく必ず get_current_weather を使うこと。歴史・文化・人物・地理・言語・科学など自分が知っている一般知識・歴史的事実はツールを使わず直接答えること（例：築城時期・創業年・歴史的出来事など）。' +
  '【回答ルール】' +
  'ルート案内の結果が得られたら、「○○から●●のルートをGoogleマップでご案内します。リンクからご確認ください。」と一言だけ伝えること。具体的な路線名・出発時刻・到着時刻・所要時間・乗り換え情報などは一切読み上げないこと（Googleマップリンクが自動表示されるため）。' +
  'お店・スポットの検索結果が得られたら、上位3件について名前・評価・住所・営業状況と特徴・見どころを2〜3文ずつ紹介すること。検索結果が得られなかった場合も、自分の知識でスポット・お店を3件以上それぞれ2〜3文で詳しく紹介すること（「検索できませんでした」とだけ言うのは禁止）。スポット・お店の紹介を始める前に、必ず「〇〇のおすすめグルメをご紹介します。」「〇〇のおすすめスポットをいくつかご紹介させていただきます。」のような一文のイントロを入れること。ただし「〇つご紹介します」「〇件ご紹介します」など具体的な件数を含む宣言は禁止（「いくつか」はOK）。スポット・お店を紹介するときは、各スポット名を必ず【スポット名】の形式で先頭に記載すること（例：【弘前城】は…）。各店舗のGoogle マップリンクは自動で表示されるため「詳細はリンクをご確認ください」などのリンク誘導フレーズは言わないこと。リンクが出せないとは絶対に言わないこと（システムが自動表示するため）。ユーザーが特定のお店のリンクを求めた場合は get_places ツールでそのお店名を検索し直すこと。' +
  '会話の最初（最初のユーザー発話が空または短い場合）は「本日はいかがなさいましたか？」とだけ言ってください（必ず「か？」で終わること）。この挨拶では get_current_datetime・get_current_weather・search_web を含む一切のツールを呼ばないこと。現在時刻・日付・天気・おすすめ情報などを付け加えることも禁止。返答は「本日はいかがなさいましたか？」の一文のみ。「ました？」「なさいました？」で終わるのは誤りなので禁止。';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DOM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const $ = s => document.querySelector(s);
const chatEl       = $('#chat');
const statusEl     = $('#status');
const startBtn     = $('#start');
const hangupBtn    = $('#hangup');
const textInputEl  = $('#textInput');
const sendBtnEl    = $('#sendBtn');
const apiKeyEl     = $('#apiKey');
const apiRowEl     = $('#apiRow');
const voiceSwitchEl= $('#voiceSwitch');
const voiceLabelEl = $('#voiceLabel');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  状態
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let ws            = null;
let captureCtx    = null;

const setStatus = text => { statusEl.textContent = text; };

function scrollBottom() {
  // smooth を使わず即時スクロール（smooth だと連続代入が無視される）
  chatEl.scrollTop = chatEl.scrollHeight;
  requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
}

function appendBubble(text, role) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
  return b;
}

// HTML エスケープ（blobページ内の文字列を安全に埋め込む）
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 新タブで「会話に戻る」バナー付きラッパーページを開く
// embedUrl: iframeに表示するURL（Maps Embed API など）
// fallbackUrl: embedUrlがない場合に直接開くURL
// title: ラッパーページのタイトル
function openInWrapper(embedUrl, fallbackUrl, title) {
  if (!embedUrl) {
    // Maps Embed API キー未設定 → そのまま新タブで開く
    window.open(fallbackUrl, '_blank');
    return;
  }
  const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>${escHtml(title)}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;display:flex;flex-direction:column;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
    .hdr{background:#2e7d32;color:#fff;padding:10px 14px;
      display:flex;align-items:center;gap:10px;flex-shrink:0;
      box-shadow:0 2px 8px rgba(0,0,0,.2);min-height:52px}
    .back{background:#fff;color:#2e7d32;border:none;
      padding:9px 18px;border-radius:9px;font-weight:700;
      font-size:15px;cursor:pointer;white-space:nowrap;
      box-shadow:0 1px 4px rgba(0,0,0,.12)}
    .back:active{opacity:.8}
    .ttl{flex:1;font-size:14px;font-weight:600;opacity:.92;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .frame{flex:1;border:none;width:100%;display:block}
    .err{display:none;flex:1;align-items:center;justify-content:center;
      flex-direction:column;gap:14px;padding:24px;text-align:center;
      color:#6b7280;font-size:15px}
    .err a{color:#2e7d32;font-weight:700}
  </style>
</head>
<body>
  <div class="hdr">
    <button class="back" onclick="if(opener&&!opener.closed){opener.focus();}window.close()">
      ← 会話に戻る
    </button>
    <span class="ttl">${escHtml(title)}</span>
  </div>
  <iframe class="frame" id="frm" src="${escHtml(embedUrl)}"
    allowfullscreen allow="geolocation"></iframe>
  <div class="err" id="err">
    <div>⚠️ このページはiframe内に表示できません</div>
    <a href="${escHtml(fallbackUrl)}" target="_top">直接開く ↗</a>
  </div>
  <script>
    // iframe読み込みエラー検知（X-Frame-Optionsで弾かれた場合）
    const frm = document.getElementById('frm');
    const errEl = document.getElementById('err');
    frm.addEventListener('error', () => {
      frm.style.display = 'none';
      errEl.style.display = 'flex';
    });
    // 5秒後にiframeのheight確認（一部ブラウザ対策）
    setTimeout(() => {
      try { if(!frm.contentDocument) throw 1; }
      catch { /* cross-origin: 正常 */ }
    }, 5000);
  <\/script>
</body>
</html>`;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);
  window.open(blobUrl, '_blank');
  setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
}

// リンク付きバブル
// items: Array<{text, url, embedUrl?}>
//   embedUrl がある場合 → openInWrapper（ラッパーページ）
//   ない場合            → window.open（新タブ直接）
function appendBubbleWithLinks(items, role) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.lineHeight = '1.9';
  items.forEach((item, i) => {
    if (i > 0) b.appendChild(document.createElement('br'));
    if (item.url) {
      const a = document.createElement('a');
      a.href = item.url;
      a.textContent = item.text;
      a.style.cssText = 'color:var(--green);text-decoration:underline;word-break:break-all;cursor:pointer;';
      a.addEventListener('click', e => {
        e.preventDefault();
        const title = item.text.replace(/^\S+\s*/, '').slice(0, 30);
        openInWrapper(item.embedUrl || null, item.url, title);
      });
      b.appendChild(a);
    } else {
      b.appendChild(document.createTextNode(item.text));
    }
  });
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
  return b;
}

// AI応答バブル（ストリーミング用）
function ensureAiBubble() {
  if (!pendingBubble) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const b = document.createElement('div');
    b.className = 'bubble typing';
    b.textContent = '';
    // data-state: 'empty' | 'indicator' | 'text'
    b.dataset.state = 'empty';
    row.appendChild(b);
    chatEl.appendChild(row);
    pendingBubble = b;
    scrollBottom();
  }
  return pendingBubble;
}

let lastFinishedBubble = null;   // 直前に確定したAIバブル
let lastBubbleFinishTime = 0;    // 確定した時刻（転写遅延検出用）

function finishAiBubble() {
  if (!pendingBubble) return;
  pendingBubble.classList.remove('typing');
  // テキスト転写が届かなかった場合（音声のみ）のフォールバック
  if (pendingBubble.dataset.state !== 'text') {
    pendingBubble.textContent = '（音声応答）';
  }
  pendingBubble.dataset.state = 'done';
  lastFinishedBubble  = pendingBubble;
  lastBubbleFinishTime = Date.now();
  pendingBubble = null;
  scrollBottom();
}

// マイクインジケータ付きステータス
function setListening(on) {
  if (on) {
    statusEl.innerHTML = '<span class="mic-dot"></span>聞いています';
  } else {
    setStatus('接続済み');
  }
}

// 長い地名から先にマッチさせるためキーを長さ降順でソート済みの配列を作成
const PLACE_READINGS_SORTED = Object.keys(PLACE_READINGS).sort((a, b) => b.length - a.length);

/**
 * ツール返答テキストに地名の読みを付与して誤読を防ぐ
 * 例: "弘前城" → "弘前城（ひろさきじょう）"
 * すでに（）が付いている箇所は二重付与しない
 */
function applyPlaceReadings(text) {
  if (!text) return text;
  let result = text;
  for (const place of PLACE_READINGS_SORTED) {
    if (!result.includes(place)) continue;
    // 漢字・読み括弧が後続する場合はスキップ
    // 例:「弘前城（ひろさきじょう）」の中の「弘前」や、既に付与済みの「弘前（ひろさき）」を二重変換しない
    const replaceRegex = new RegExp(place + '(?![\u4E00-\u9FFF\u3400-\u4DBF（])', 'g');
    result = result.replace(replaceRegex, `${place}（${PLACE_READINGS[place]}）`);
  }
  return result;
}

function wxEmoji(cond) {
  if (!cond) return '🌡';
  if (cond.includes('快晴') || (cond.includes('晴') && !cond.includes('曇'))) return '☀️';
  if (cond.includes('晴') && cond.includes('曇')) return '🌤';
  if (cond.includes('曇') && !cond.includes('雨') && !cond.includes('雪')) return '☁️';
  if (cond.includes('霧雨') || (cond.includes('雨') && cond.includes('小'))) return '🌦';
  if (cond.includes('雷')) return '⛈';
  if (cond.includes('みぞれ') || cond.includes('霙')) return '🌨';
  if (cond.includes('雪')) return '❄️';
  if (cond.includes('雨')) return '🌧';
  if (cond.includes('霧')) return '🌫';
  return '🌡';
}


async function fetchWeather(location, date = 'today') {
  const fetchWithTimeout = (url, opts = {}, ms = 8000) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
  };

  // ① Nominatim でジオコーディング（都道府県情報付き）
  const nomUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(location)}&format=json&countrycodes=jp&limit=3&accept-language=ja&addressdetails=1`;
  let nomData;
  try {
    const nomResp = await fetchWithTimeout(nomUrl, { headers: { 'Accept-Language': 'ja', 'Accept': 'application/json' } });
    nomData = await nomResp.json();
  } catch (e) {
    return { text: `「${location}」の位置情報の取得に失敗しました（${e.name === 'AbortError' ? 'タイムアウト' : e.message}）`, blobUrl: null };
  }
  if (!nomData?.length) return { text: `「${location}」の位置情報が見つかりませんでした。`, blobUrl: null };

  const best = nomData[0];
  const displayName = best.display_name?.split(',')[0]?.trim() || location;
  const lat = parseFloat(best.lat);
  const lon = parseFloat(best.lon);

  // ② 都道府県名を取得（優先順：forward geocoding state → reverse geocoding state → county）
  // JMA_AREA_CODE のキーに照合して正規化する関数
  const matchPrefecture = (raw) => {
    if (!raw) return null;
    for (const [key, code] of Object.entries(JMA_AREA_CODE)) {
      if (raw === key || raw.includes(key) || key.includes(raw.replace(/[都道府県道振興局].*$/, '').slice(0, 3))) {
        return { name: key, code };
      }
    }
    return null;
  };

  let prefecture = '';
  let areaCode = null;

  // まず forward geocoding の address.state を試す（最も信頼性が高い）
  const fwdState = best.address?.state || '';
  const fwdMatch = matchPrefecture(fwdState);
  if (fwdMatch) {
    prefecture = fwdMatch.name;
    areaCode   = fwdMatch.code;
    console.info('[weather] prefecture from forward geocode:', prefecture);
  }

  // 次に reverse geocoding（zoom=5 = state レベル）
  if (!areaCode) {
    try {
      const revUrl = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja&zoom=5&addressdetails=1`;
      const revResp = await fetchWithTimeout(revUrl, { headers: { 'Accept-Language': 'ja', 'Accept': 'application/json' } });
      const revData = await revResp.json();
      // state → county → name の順に試し、JMA_AREA_CODE に照合できたものだけ採用
      for (const raw of [revData?.address?.state, revData?.address?.county, revData?.name]) {
        const m = matchPrefecture(raw);
        if (m) { prefecture = m.name; areaCode = m.code; break; }
      }
      console.info('[weather] prefecture from reverse geocode:', prefecture || '(not found)');
    } catch(e) {
      console.warn('[weather] reverse geocode failed:', e.message);
    }
  }

  // フォールバック: display_name 全文に都道府県名が含まれるか
  if (!areaCode) {
    const displayFull = best.display_name || '';
    for (const [key, code] of Object.entries(JMA_AREA_CODE)) {
      if (displayFull.includes(key)) { prefecture = key; areaCode = code; break; }
    }
  }
  // フォールバック: 入力地名から都道府県を推定
  if (!areaCode) {
    for (const [key, code] of Object.entries(JMA_AREA_CODE)) {
      const bare = key.replace(/[都道府県]$/, '');
      if (bare && (location.includes(bare) || location.includes(key))) {
        prefecture = key; areaCode = code; break;
      }
    }
  }
  if (!areaCode) {
    return { text: `「${location}」の都道府県を特定できませんでした（例: 仙台市、青森市、東京など都市名で入力してください）`, blobUrl: null };
  }

  // エリア表示名は必ず JMA_AREA_CODE の正式都道府県名を使う
  const areaName_pre = prefecture || displayName;

  // 週間天気（明後日以降）は気象庁の週間予報ページへ誘導
  if (date === 'weekly') {
    const jmaWeeklyUrl = `https://www.jma.go.jp/bosai/forecast/#area_type=offices&area_code=${areaCode}`;
    const text = `【天気案内指示】必ず「${areaName_pre}」と都道府県名で案内すること。「${areaName_pre}」以外の地名（石狩振興局・石狩地方・振興局・地方など細分地域名）は絶対に使わないこと。` +
      `\n${areaName_pre}の週間天気予報（明後日以降）は気象庁のサイトでご確認いただけます。気象庁の週間天気予報ページのリンクを案内してください。（気象庁データ）`;
    return { text, blobUrl: jmaWeeklyUrl };
  }

  // ③ 気象庁 JSON API（無料・APIキー不要）
  const jmaUrl = `https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`;
  let jmaData;
  try {
    const jmaResp = await fetchWithTimeout(jmaUrl);
    if (!jmaResp.ok) throw new Error(`HTTP ${jmaResp.status}`);
    jmaData = await jmaResp.json();
  } catch (e) {
    return { text: `気象庁データの取得に失敗しました（${e.message}）`, blobUrl: null };
  }

  // JST 日付文字列（YYYY-MM-DD）
  const jstNow = new Date(Date.now() + 9 * 3600 * 1000);
  const todayStr    = jstNow.toISOString().slice(0, 10);
  const tomorrowStr = new Date(jstNow.getTime() + 86400000).toISOString().slice(0, 10);

  const ts = jmaData[0].timeSeries;

  // --- 天気テキスト（timeSeries[0]: 今日・明日・明後日）---
  const wxArea = ts[0].areas[0];
  const todayWx    = (wxArea.weathers?.[0] || '不明').replace(/\s+/g, '');
  const tomorrowWx = (wxArea.weathers?.[1] || '不明').replace(/\s+/g, '');

  // --- 降水確率（timeSeries[1]: 6時間毎）---
  const popSeries = ts[1];
  const popArea   = popSeries.areas[0];
  const popDefs   = popSeries.timeDefines;
  const maxPop = (dayStr) => {
    const vals = popDefs
      .map((t, i) => t.startsWith(dayStr) ? parseInt(popArea.pops?.[i] ?? '-1') : -1)
      .filter(v => v >= 0);
    return vals.length ? Math.max(...vals) : '--';
  };
  const todayRain    = maxPop(todayStr);
  const tomorrowRain = maxPop(tomorrowStr);

  // --- 気温（jmaData 全要素の全 timeSeries からロバストに取得）---
  let todayTmax = '--', todayTmin = '--', tomorrowTmax = '--', tomorrowTmin = '--';

  const extractTemps = (series) => {
    if (!series) return;
    const defs = series.timeDefines;
    if (!defs) return;
    // この series が temps データを持つか確認
    const hasTomorrow = defs.some(t => t.slice(0, 10) === tomorrowStr);
    const hasTemps    = series.areas?.some(a => a.temps?.length > 0);
    if (!hasTemps) return;
    console.info('[weather] temp series timeDefines:', defs.slice(0, 6), 'hasTomorrow:', hasTomorrow);
    for (let aIdx = 0; aIdx < (series.areas?.length || 0); aIdx++) {
      const area  = series.areas[aIdx];
      const temps = area.temps;
      if (!Array.isArray(temps)) continue;
      defs.forEach((t, i) => {
        const val = String(temps[i] ?? '').trim();
        if (!val || val === 'null') return;
        const dayStr = t.slice(0, 10);
        const hour   = parseInt(t.slice(11, 13));
        if (dayStr === todayStr) {
          if (hour >= 6) { if (todayTmax === '--') todayTmax = val; }
          else           { if (todayTmin === '--') todayTmin = val; }
        } else if (dayStr === tomorrowStr) {
          if (hour >= 6) { if (tomorrowTmax === '--') tomorrowTmax = val; }
          else           { if (tomorrowTmin === '--') tomorrowTmin = val; }
        }
      });
    }
  };

  // jmaData の全要素（[0],[1],[2]…）の全 timeSeries を探索
  for (let di = 0; di < jmaData.length; di++) {
    for (const series of (jmaData[di]?.timeSeries || [])) {
      if (tomorrowTmax !== '--' && tomorrowTmin !== '--') break; // 取得済みなら終了
      extractTemps(series);
    }
    if (tomorrowTmax !== '--' && tomorrowTmin !== '--') break;
  }
  console.info('[weather] temps today:', todayTmax, todayTmin, '/ tomorrow:', tomorrowTmax, tomorrowTmin);

  // --- 結果組み立て ---
  const cond = date === 'tomorrow' ? tomorrowWx : todayWx;
  const tmax = date === 'tomorrow' ? tomorrowTmax : todayTmax;
  const tmin = date === 'tomorrow' ? tomorrowTmin : todayTmin;
  const rain = date === 'tomorrow' ? tomorrowRain : todayRain;
  // 実際の月日をラベルに含める（Geminiが正しい日付を言えるよう、月日を先頭に置く）
  const targetDate = date === 'tomorrow'
    ? new Date(jstNow.getTime() + 86400000)
    : jstNow;
  const mm = targetDate.getUTCMonth() + 1;
  const dd = targetDate.getUTCDate();
  const dateLabel = date === 'tomorrow' ? `${mm}月${dd}日（明日）の天気予報` : `${mm}月${dd}日（今日）の天気予報`;

  const tempStr = (tmax !== '--' || tmin !== '--')
    ? `、最高${tmax !== '--' ? tmax + '°C' : '−'}／最低${tmin !== '--' ? tmin + '°C' : '−'}`
    : '';
  const rainStr = rain !== '--' ? `、降水確率${rain}%` : '';
  // 気象庁データは都道府県レベルなので、都道府県名で案内する
  const areaName = areaName_pre;
  // ツールテキストは「都道府県名で」という形に固定し、Geminiの言い換えを防ぐ
  const tempInstruction = (tmax !== '--' || tmin !== '--') ? '最高気温・最低気温を必ず返答に含めること。' : '（気温データなし）';
  const text = `【天気案内指示】必ず「${areaName}」と都道府県名で案内すること。「${areaName}」以外の地名（石狩振興局・石狩地方・振興局・地方など細分地域名）は絶対に使わないこと。${tempInstruction}` +
    `\n${areaName}の${dateLabel}: ${cond}${tempStr}${rainStr}（気象庁データ）`;

  // 気象庁公式予報ページへの直接リンク
  const jmaPageUrl = `https://www.jma.go.jp/bosai/forecast/#area_type=offices&area_code=${areaCode}`;
  return { text, blobUrl: jmaPageUrl };
}

async function applyFurigana(text) {
  if (!text) return text;

  const appId = getYahooKey();
  if (!appId) {
    console.info('[furigana] Yahoo App ID 未設定 → ローカル辞書のみ使用');
    return applyPlaceReadings(text);
  }

  console.info('[furigana] Yahoo API 呼び出し開始（App ID先頭8文字:', appId.slice(0,8), '）');
  try {
    const resp = await fetch('https://purple-sound-f205.ueda23201711.workers.dev/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-AppId': appId
      },
      body: JSON.stringify({
        id: '1',
        jsonrpc: '2.0',
        method: 'jlp.furiganaservice.furigana',
        params: { q: text, grade: 1 }
      })
    });
    console.info('[furigana] HTTPステータス:', resp.status);
    if (resp.ok) {
      const data = await resp.json();
      console.info('[furigana] レスポンス:', JSON.stringify(data).slice(0, 200));
      const words = data.result?.word || [];
      if (words.length > 0) {
        const annotated = words.map(w => {
          const surface = w.surface || '';
          const furigana = w.furigana || '';
          if (furigana && /[一-鿿㐀-䶿]/.test(surface)) {
            return `${surface}（${furigana}）`;
          }
          return surface;
        }).join('');
        console.info('[furigana] Yahoo API 適用完了 → ローカル辞書も重ね適用');
        return applyPlaceReadings(annotated);
      } else {
        console.warn('[furigana] Yahoo API: wordsが空 → ローカル辞書で代替');
      }
    } else {
      const errText = await resp.text();
      console.warn('[furigana] Yahoo API エラー応答:', resp.status, errText.slice(0, 200));
    }
  } catch (e) {
    console.warn('[furigana] Yahoo API 例外 → ローカル辞書で代替:', e.message);
  }

  return applyPlaceReadings(text);
}

// ツール返答テキストから（よみ）注釈を抽出して読み方ブロックを先頭に付与
function prependReadingGuide(text) {
  const regex = /([\u4E00-\u9FFF\u3400-\u4DBFa-zA-Zぁ-んァ-ン々〆ヵヶ]+)（([ぁ-ん]+)）/g;
  const pairs = [];
  const seen = new Set();
  let m;
  while ((m = regex.exec(text)) !== null) {
    const key = m[1];
    if (!seen.has(key)) { seen.add(key); pairs.push(`${m[1]}は${m[2]}と発音する`); }
  }
  if (pairs.length === 0) return text;
  return `※読み方: ${pairs.join('。')}。\n` + text;
}

//  場所・お店検索（Google Places API New）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function fetchPlaces(query) {
  const key = getPlacesKey();
  if (!key) return 'Google Places APIキーが未設定です。接続前にPlacesキー欄に入力してください。';

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);

  let resp;
  try {
    resp = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method: 'POST',
      signal: ctrl.signal,
      headers: {
        'Content-Type':      'application/json',
        'X-Goog-Api-Key':    key,
        'X-Goog-FieldMask':  'places.displayName,places.formattedAddress,places.rating,places.googleMapsUri,places.regularOpeningHours.openNow'
      },
      body: JSON.stringify({
        textQuery:       query,
        languageCode:    'ja',
        maxResultCount:  5
      })
    });
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'タイムアウト' : e.message;
    return `Places検索エラー: ${msg}`;
  } finally {
    clearTimeout(timer);
  }

  let data;
  try { data = await resp.json(); } catch { return 'Places APIのレスポンスが不正です。'; }
  console.info('[Places]', resp.status, JSON.stringify(data).slice(0, 300));

  if (!resp.ok) return `Places APIエラー (${resp.status}): ${data.error?.message || JSON.stringify(data)}`;

  const places = data.places || [];
  if (!places.length) return `「${query}」に該当するお店・場所が見つかりませんでした。`;

  // Geminiへ渡すテキスト＋個別マップURIを返す
  const top = places.slice(0, 5);
  const text = top.map((p, i) => {
    const name   = p.displayName?.text || '不明';
    const addr   = (p.formattedAddress || '').replace('日本、', '');
    const rating = p.rating ? `★${p.rating}` : '';
    const open   = p.regularOpeningHours?.openNow === true  ? '営業中' :
                   p.regularOpeningHours?.openNow === false ? '営業時間外' : '';
    return `${i+1}. ${name} ${rating} ${open} ${addr}`.trim();
  }).join('\n');
  const placeLinks = top.slice(0, 3).map(p => {
    const name = p.displayName?.text || '不明';
    const addr = (p.formattedAddress || '').replace('日本、', '');
    // googleMapsUri がなければ名前+住所でマップ検索URLを構築
    const mapsUri = p.googleMapsUri ||
      `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + addr)}`;
    return { name, mapsUri };
  });
  return { text, placeLinks };
}

// ── OpenStreetMap Nominatim によるジオコーディング（無料・キー不要・ブラウザ対応）
async function geocodeStation(stationName, fetcher = fetch) {
  // 「駅」を末尾に付加して検索精度を向上
  const query = stationName.endsWith('駅') ? stationName : stationName + '駅';
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&countrycodes=jp&limit=3`;

  let resp;
  try {
    resp = await fetcher(url, {
      headers: { 'Accept-Language': 'ja', 'Accept': 'application/json' }
    });
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'タイムアウト（8秒）' : e.message;
    throw new Error(`Geocoding通信エラー: ${msg}`);
  }

  let results;
  try { results = await resp.json(); } catch { results = []; }
  console.info(`[Geocode Nominatim] "${stationName}" 件数:`, results.length, results[0]);

  // 「railway=station」または「public_transport=stop_position」を優先
  const station = results.find(r => r.type === 'station' || r.class === 'railway')
                  || results[0];

  if (!station) {
    throw new Error(`「${stationName}」の位置情報が見つかりませんでした。駅名を確認してください。`);
  }

  const lat = parseFloat(station.lat);
  const lng = parseFloat(station.lon);
  console.info(`[Geocode] "${stationName}" → lat:${lat}, lng:${lng} (${station.display_name})`);
  return { lat, lng };
}

// ルートカード用 Blob URL を構造化データから生成
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  音声再生
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ensurePlayCtx() {
  if (!playCtx || playCtx.state === 'closed') {
    playCtx  = new AudioContext({ sampleRate: OUT_RATE });
    nextPlayAt = 0;
  }
  if (playCtx.state === 'suspended') playCtx.resume();
  return playCtx;
}


function playPcmChunk(base64) {
  if (!voiceOn) return;
  try {
    const ctx = ensurePlayCtx();
    // base64 → Uint8 → Int16 → Float32
    const raw = atob(base64);
    const u8  = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    const i16 = new Int16Array(u8.buffer);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768.0;

    const buf = ctx.createBuffer(1, f32.length, OUT_RATE);
    buf.getChannelData(0).set(f32);

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);

    const now = ctx.currentTime;
    const t   = Math.max(now + 0.01, nextPlayAt);
    src.start(t);
    nextPlayAt = t + buf.duration;
  } catch (e) {
    console.warn('[play]', e);
  }
}

function stopPlayback() {
  if (playCtx) {
    try { playCtx.close(); } catch {}
    playCtx    = null;
    nextPlayAt = 0;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  音声キャプチャ
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function startCapture() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation : true,
        noiseSuppression : true,
        autoGainControl  : true,
        channelCount     : 1
      }
    });
  } catch (e) {
    appendBubble(`マイクへのアクセスに失敗しました: ${e.message}`, 'system');
    return;
  }

  // 16kHz AudioContext
  captureCtx = new AudioContext({ sampleRate: IN_RATE });
  const source = captureCtx.createMediaStreamSource(mediaStream);
  scriptProc   = captureCtx.createScriptProcessor(4096, 1, 1);

  scriptProc.onaudioprocess = e => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)));
    }
    micBuffer.push(i16);
  };

  source.connect(scriptProc);
  scriptProc.connect(captureCtx.destination); // ScriptProcessor は接続が必要

  // AudioContext が suspended になっていたら再開（ブラウザの自動停止対策）
  if (captureCtx.state === 'suspended') {
    await captureCtx.resume();
  }
  console.info('[capture] AudioContext state:', captureCtx.state, 'sampleRate:', captureCtx.sampleRate);
  // 定期送信
  flushTimer = setInterval(flushMicChunks, FLUSH_MS);

  // Speech Recognition（AIが話していない間だけ動作）
}


// base64 変換 (大バッファ対応)
function uint8ToBase64(u8) {
  const CHUNK = 8192;
  let s = '';
  for (let i = 0; i < u8.length; i += CHUNK) {
    s += String.fromCharCode(...u8.subarray(i, Math.min(i + CHUNK, u8.length)));
  }
  return btoa(s);
}

function flushMicChunks() {
  if (!ws || ws.readyState !== WebSocket.OPEN || micBuffer.length === 0) return;

  const total = micBuffer.reduce((s, c) => s + c.length, 0);
  const merged = new Int16Array(total);
  let offset = 0;
  for (const c of micBuffer) { merged.set(c, offset); offset += c.length; }

  // AI発話中はRMS音量を計測してエコーか実発話かを判定
  if (aiTalking) {
    const rms = Math.sqrt(merged.reduce((s, v) => s + v * v, 0) / merged.length) / 32768;
    const BARGE_IN_THRESHOLD = 0.10;  // 0〜1スケール。エコー≈0.01〜0.05、肉声≈0.10〜
    if (rms < BARGE_IN_THRESHOLD) {
      micBuffer = [];  // エコー程度の音量 → 捨てる
      return;
    }
    // 閾値超え = ユーザーが割り込んで発話 → 再生を即停止してバージイン
    console.info('[barge-in] rms:', rms.toFixed(4), '→ 割り込み検出');
    stopPlayback();
    aiTalking = false;
  }

  micBuffer = [];
  const b64 = uint8ToBase64(new Uint8Array(merged.buffer));
  ws.send(JSON.stringify({
    realtimeInput: {
      audio: { data: b64, mimeType: `audio/pcm;rate=${IN_RATE}` }
    }
  }));
}

function stopCapture() {
  if (flushTimer)  { clearInterval(flushTimer); flushTimer = null; }
  aiTalking = false;
  if (scriptProc)  { try { scriptProc.disconnect(); } catch {} scriptProc = null; }
  if (captureCtx)  { try { captureCtx.close();     } catch {} captureCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  micBuffer = [];
}

// ── APIキー事前検証（REST） ───────────────────────────────
async function validateApiKey(apiKey) {
  setStatus('APIキー確認中…');

  // ページネーションで全モデルを取得
  let allModels = [];
  let pageToken = '';
  for (let page = 0; page < 5; page++) {
    const qs = pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '';
    const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}&pageSize=50${qs}`;
    let resp;
    try {
      resp = await fetch(url);
    } catch (e) {
      throw new Error('ネットワークエラー: インターネット接続を確認してください。');
    }
    if (resp.status === 400 || resp.status === 401) {
      throw new Error('APIキーが無効です。AI Studio で正しいキーをコピーし直してください。');
    }
    if (resp.status === 403) {
      throw new Error(
        'APIキーに権限がありません（HTTP 403）\n\n' +
        '確認事項:\n' +
        '① APIキーと請求先（Billing）が同じプロジェクトにあるか\n' +
        '② Google Cloud Console で「Generative Language API」が有効か\n' +
        '③ APIキーの「APIの制限」で制限されていないか'
      );
    }
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(`APIエラー (${resp.status}): ${body.error?.message || '不明なエラー'}`);
    }
    const data = await resp.json();
    allModels = allModels.concat(data.models || []);
    if (data.nextPageToken) {
      pageToken = data.nextPageToken;
    } else {
      break;
    }
  }

  // Live API 対応モデルを探す
  const liveModels = allModels
    .filter(m => m.supportedGenerationMethods?.includes('bidiGenerateContent'))
    .map(m => m.name);
  console.info('[validateApiKey] 全モデル数:', allModels.length, 'Live対応:', liveModels);

  // モデル候補から使えるものを選択
  const found = MODEL_CANDIDATES.find(c => liveModels.includes(c));
  if (found) MODEL = found;
  else if (liveModels.length > 0) MODEL = liveModels[0];

  if (liveModels.length === 0) {
    throw new Error(
      `このAPIキーではGemini Live APIが使用できません。\n取得モデル数: ${allModels.length}件\n\n` +
      '考えられる原因:\n' +
      '① APIキーと請求先（Billing）が別プロジェクトにある\n' +
      '② Billingを有効化したばかりで反映待ち（5〜30分）\n' +
      '③ 「Generative Language API」が未有効\n\n' +
      '→ console.cloud.google.com で\n  APIキーのプロジェクトとBilling設定を確認してください。'
    );
  }

  console.info('[モデル一覧]', liveModels);
  // 接続開始メッセージはシンプルに
  // appendBubble(`接続中… (${MODEL.split('/').pop()})`, 'system');  // GitHub公開用に非表示
  return true;
}

                  enum: ['today', 'tomorrow']
                }
              },
              required: ['from_station', 'to_station']
            }
          }, {
            name: 'search_web',
            description: '最新情報・時事情報・現在の営業状況・今年の開催日程など、自分の学習データでは正確に答えられない時事性のある情報を検索します。歴史的事実・一般知識・文化・地理など既知の情報はツールを使わず直接回答してください。【重要】天気・天気予報（今日・明日・明後日・週間を問わず）には絶対に使わないこと。天気は必ず get_current_weather を使うこと。出発地と目的地が明示された移動・ルート案内・乗り換え質問には絶対に使わないこと。必ず get_route を使うこと。',
            parameters: {
              type: 'OBJECT',
              properties: {
                query: {
                  type: 'STRING',
                  description: '検索クエリ（例: 浅草 祭り 2025, 東京 花火大会, 京都 紅葉 見頃）'
                }
              },
              required: ['query']
            }
          }]
        }],
        // 音声の文字起こし（届けばバブルに表示、届かなくても無害）
        outputAudioTranscription: {},
        inputAudioTranscription:  {},
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
      }
    };
    console.info('[setup] モデル:', MODEL, 'isNativeAudio:', isNativeAudio, 'config:', JSON.stringify(genConfig));
    ws.send(JSON.stringify(setupMsg));
  };

  // Gemini Live API はメッセージを Blob で送ってくることがある
  ws.binaryType = 'blob';
  let setupTimer = setTimeout(() => {
    if (statusEl.textContent === '接続中…') {
      appendBubble('⏱ タイムアウト: 15秒待ってもサーバーから応答がありませんでした。', 'system');
      doDisconnect();
    }
  }, 15000);

  ws.onmessage = async event => {
    try {
      const text = (event.data instanceof Blob) ? await event.data.text() : event.data;
      const msg = JSON.parse(text);
      // セットアップタイマーをクリア
      if (msg.setupComplete !== undefined && setupTimer) {
        clearTimeout(setupTimer);
        setupTimer = null;
      }
      // エラーメッセージを表示
      if (msg.error) {
        appendBubble(`❌ サーバーエラー: ${msg.error.message || JSON.stringify(msg.error)}`, 'system');
        doDisconnect();
        return;
      }
      const topKeys = Object.keys(msg);
      if (!topKeys.includes('serverContent') || Object.keys(msg.serverContent||{}).length) {
        console.info('[msg]', topKeys, JSON.stringify(msg).slice(0,120));
      }
      handleServerMsg(msg);
    } catch (e) {
      console.warn('[ws.onmessage] parse error:', e, String(event.data).slice(0,50));
    }
  };

  ws.onerror = e => {
    console.error('[ws] error:', e);
    // onclose が必ず続いて呼ばれるので、エラーログだけ残す
  };

  ws.onclose = e => {
    console.warn('[ws] closed', e.code, e.reason);
    if (statusEl.textContent === '未接続') return; // すでに切断済み
    const msgs = {
      1006: '⚠️ 接続が突然切れました（コード1006）\n\n考えられる原因:\n• APIキーに Live API の権限がない\n• ファイアウォールが WSS 接続をブロックしている\n• ブラウザの拡張機能が干渉している\n\n→ ブラウザのコンソール（F12）でエラーを確認してください。',
      1008: sessionActive
        ? '⚠️ セッションが終了しました（コード1008）\n\n会話中に接続が切れた主な原因:\n• セッション時間の上限（約10〜15分）に達した\n• サーバー側の一時的な制限\n\n→「切断」してから「会話開始」を押し直すと再開できます。'
        : '⚠️ 接続が拒否されました（コード1008）\n\n【最も可能性が高い原因】\nGemini Live API は無料枠では使用できません。\nGoogle Cloud Console で請求先アカウント（Billing）を有効にする必要があります。\n\nその他の原因:\n• Generative Language API が有効でない\n• APIキーの利用制限\n\n対処手順:\n① console.cloud.google.com を開く\n② 「お支払い」→ クレジットカードを登録\n③ 「APIとサービス」→ Generative Language API を有効化\n④ 5分後に再試行',
      1011: '⚠️ Geminiサーバーでエラーが発生しました（コード1011）\nしばらく待ってから再接続してください。',
    };
    const reason = e.reason ? `\n\n詳細: ${e.reason}` : '';
    const base = msgs[e.code] || `⚠️ 切断されました（コード${e.code}）`;
    const msg = base + reason;
    appendBubble(msg, 'system');
    doDisconnect();
  };
}

async function handleServerMsg(msg) {
  // ── セットアップ完了 ───────────────────────────────
  if (msg.setupComplete !== undefined) {
    sessionActive = true;
    setStatus('接続済み');
    startBtn.disabled   = true;
    hangupBtn.disabled  = false;
    textInputEl.disabled = false;
    sendBtnEl.disabled  = false;
    apiRowEl.style.display = 'none';

    // APIキー状態の表示（GitHub公開用に非表示）
    // const statusParts = [...];
    // appendBubble('APIキー状態: ...', 'system');

    startCapture().then(() => {
      // マイク準備完了後に挨拶トリガー
      if (!isGreeted) {
        isGreeted = true;
        const sendGreeting = () => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            // Gemini 3.1: realtimeInput に短いテキストを送って挨拶を促す
            // （空文字・clientContent はどちらも 3.1 では無視される）
            ws.send(JSON.stringify({
              realtimeInput: { text: '。' }
            }));
          }
        };
        sendGreeting();
        // 6秒待っても音声バブルが出なければ挨拶を再送（1回のみ）
        // turnComplete 受信時にキャンセルするため greetingRetryTimer に保存
        greetingRetryTimer = setTimeout(() => {
          greetingRetryTimer = null;
          // '.row.assistant .bubble' で AI バブルを検出（.bubble.ai は存在しない）
          const bubbles = document.querySelectorAll('.row.assistant .bubble');
          if (bubbles.length === 0 && !pendingBubble && !lastFinishedBubble && ws && ws.readyState === WebSocket.OPEN) {
            console.info('[greeting] 再送');
            sendGreeting();
          }
        }, 6000);
      }
    });
    return;
  }

  // ── サーバーコンテンツ（AI応答）────────────────────
  if (msg.serverContent) {
    const sc = msg.serverContent;
    // どんなキーが来ているか確認
    const keys = Object.keys(sc);
    if (keys.length) console.info('[serverContent keys]', keys);

    // モデル応答パーツ
    if (sc.modelTurn && sc.modelTurn.parts) {
      for (const part of sc.modelTurn.parts) {
          // 内部思考（thought）はスキップ
          if (part.thought) continue;
        // 音声データ
        if (part.inlineData && part.inlineData.mimeType &&
            part.inlineData.mimeType.startsWith('audio/pcm')) {
          if (!aiTalking) {
            aiTalking = true;
            micBuffer = [];  // AIが喋り始める瞬間のバッファを破棄（エコー防止）
            const b = ensureAiBubble();
            // テキスト転写がまだ届いていない場合だけ🔊インジケーターをセット
            if (b.dataset.state === 'empty') {
              b.textContent = '🔊';
              b.dataset.state = 'indicator';
            }
          }
          playPcmChunk(part.inlineData.data);
        }
        // テキストデータ（モデルがテキストモダリティで返した場合）
        if (typeof part.text === 'string' && part.text.length > 0) {
          const b = ensureAiBubble();
          if (b.dataset.state !== 'text') {
            b.textContent = part.text;
            b.dataset.state = 'text';
          } else {
            b.textContent += part.text;
          }
          scrollBottom();
        }
      }
    }

    // ユーザー音声の文字起こし（Geminiサーバーから）
    if (sc.inputTranscription) {
      const t = sc.inputTranscription.text || '';
      console.info('[inputTranscription]', t);
      // 非日本語（英語など）の誤認識テキストは表示・蓄積しない
      const _hasJapanese = /[぀-ゟ゠-ヿ一-鿿･-ﾟ]/.test(t);
      const _latinOnly   = /^[a-zA-Z0-9\s\W]+$/.test(t.trim());
      if (t && (_hasJapanese || !_latinOnly)) {
        if (!pendingUserBubble) {
          pendingUserBubble = appendBubble('', 'user');
          toolCalledThisTurn = false;  // 新しいユーザーターン開始: リセット
        }
        pendingUserBubble.textContent += t;
        lastUserQuery += t;  // ターン内のユーザー発話を蓄積
        userSpokeInTurn = true;  // このターンでユーザーが実際に発話した
        lastInputWasText = false;  // 音声入力なのでフラグをリセット
        scrollBottom();
      } else if (t) {
        console.info('[inputTranscription] 非日本語テキストをスキップ:', t);
      }
    }

    // モデル音声の文字起こし（出力転写）
    if (sc.outputTranscription) {
      // ふりがな（よみ）をリアルタイムで除去してから表示
      const t = (sc.outputTranscription.text || '').trim().replace(/（[ぁ-ん]+）/g, '');
      if (t) {
        // turnComplete 後に転写が遅れて届いた場合（500ms以内）は直前のバブルに追記
        let b;
        if (!pendingBubble && lastFinishedBubble && (Date.now() - lastBubbleFinishTime) < 500) {
          b = lastFinishedBubble;
        } else {
          b = ensureAiBubble();
        }
        if (b.dataset.state === 'empty' || b.dataset.state === 'indicator') {
          b.textContent = t;
          b.dataset.state = 'text';
        } else {
          // 追加転写 or 直前バブルへの追記
          b.textContent += t;
        }
        scrollBottom();

        // 転写チャンクが届くたびにデバウンスタイマーをリセット
        // 最後のチャンクから 500ms 後にリンクを表示（吹き出し完成直後）
        if (pendingLinks.length > 0 || (!placesApiLinksAdded && b.textContent.includes('【'))) {
          if (transcriptionDoneTimer !== null) clearTimeout(transcriptionDoneTimer);
          transcriptionDoneTimer = setTimeout(() => {
            transcriptionDoneTimer = null;
            showLinksOrdered();
          }, 500);
        }
      }
    }

    // 生成完了 → デバウンスタイマーを 200ms に短縮（転写がほぼ終わっているはず）
    if (sc.generationComplete) {
      if (transcriptionDoneTimer !== null) clearTimeout(transcriptionDoneTimer);
      transcriptionDoneTimer = setTimeout(() => {
        transcriptionDoneTimer = null;
        showLinksOrdered();
      }, 200);
    }

    // ターン完了
    if (sc.turnComplete) {
      finishAiBubble();

      // 安全網: デバウンスタイマーをキャンセルして即時実行
      showLinksOrdered();
      // 残った pendingLinks を表示（通常は転写開始時点で表示済みなので空のはず）
      if (pendingLinks.length > 0) {
        pendingLinks.forEach(link => appendBubbleWithLinks([link], 'system'));
        pendingLinks = [];
      }

      // ツールが呼ばれたかどうか（リセット前に読む）
      // ※ toolCalledThisTurn はここではリセットしない
      //   turnComplete が複数回来る場合を考慮し、次のユーザー入力開始時にリセット
      const _toolWasCalled = toolCalledThisTurn;
      // 次ターン用リセット（toolCalledThisTurn は除く）
      placesApiLinksAdded = false;
      streamingSpotLinks = new Set();
      const _isGreetedNow  = greetingComplete;  // 挨拶ターン自体ではなく、その完了後に true になる
      if (isGreeted && !greetingComplete) {
        greetingComplete = true;  // 挨拶ターン完了をマーク
        // 挨拶が正常に完了したのでリトライタイマーをキャンセル
        if (greetingRetryTimer !== null) {
          clearTimeout(greetingRetryTimer);
          greetingRetryTimer = null;
          console.info('[greeting] リトライタイマーキャンセル（挨拶完了）');
        }
      }
      // ユーザー発言の誤変換補正（非同期・表示のみ更新）
      if (pendingUserBubble) {
        const _ub = pendingUserBubble;
        const _raw = _ub.textContent.trim();
        // ★ 改善: テキスト入力時は音声認識補正をスキップ
        if (_raw.length >= 3 && !lastInputWasText) correctTranscription(_ub, _raw);
      }
      // ユーザーバブルへの参照を保持しておく（inputTranscriptionが遅れて届く場合があるため）
      const _savedUserBubble = pendingUserBubble;
      pendingUserBubble = null;
      // ツールが呼ばれなかった場合: 500ms後にユーザーテキストを取得してGoogle検索リンクを追加
      // （inputTranscription が turnComplete より遅れて届くことがあるため遅延実行）
      if (!_toolWasCalled && _isGreetedNow && !googleLinkScheduled && (userSpokeInTurn || lastInputWasText)) {
        googleLinkScheduled = true;  // 重複スケジュール防止
        const _linkDelayMs = lastInputWasText ? 100 : 800;  // ★ 改善: テキスト入力時は遅延短縮
        setTimeout(() => {
          // DOMの最後のユーザーバブルから直接テキストを取得（最も確実）
          const _allUserBubbles = chatEl.querySelectorAll('.row.user .bubble');
          const _lastUserBubble = _allUserBubbles.length > 0 ? _allUserBubbles[_allUserBubbles.length - 1] : null;
          const _uq = (_lastUserBubble ? _lastUserBubble.textContent.trim() : '') || lastUserQuery.trim();

          // AIが質問（フォローアップ）で返した場合はGoogle検索リンクを出さない
          const _allAiBubbles = chatEl.querySelectorAll('.row.assistant .bubble');
          const _lastAiBubble = _allAiBubbles.length > 0 ? _allAiBubbles[_allAiBubbles.length - 1] : null;
          const _aiText = _lastAiBubble ? _lastAiBubble.textContent.trim() : '';
          const _aiAskedQuestion = /[？?]/.test(_aiText);  // AIが質問で返した

          if (_uq.length > 2 && !_aiAskedQuestion) {
            const gUrl = `https://www.google.com/search?q=${encodeURIComponent(_uq)}&hl=ja`;
            appendBubbleWithLinks([{ text: `🔎 「${_uq}」をGoogleで検索する`, url: gUrl, embedUrl: null }], 'system');
          }
          lastUserQuery = '';
          googleLinkScheduled = false;  // フラグをリセット
        }, _linkDelayMs);
      } else {
        lastUserQuery = '';
      }
      userSpokeInTurn = false;  // 次ターン用にリセット
      lastInputWasText = false;  // 次ターン用にリセット
      const waitMs = Math.max(300, (nextPlayAt - (playCtx ? playCtx.currentTime : 0)) * 1000 + 800);
      setTimeout(() => { micBuffer = []; aiTalking = false; setListening(true); }, waitMs);  // 再生完了後にマイクON
    }

    // ユーザー割り込み
    if (sc.interrupted) {
      stopPlayback();
      finishAiBubble();
      pendingUserBubble = null;
      aiTalking = false;
    }
  }  // end if (msg.serverContent)

  // ── ツール呼び出し ──────────────────────────────────
  if (msg.toolCall) {
    console.info('[toolCall]', JSON.stringify(msg.toolCall));
    toolCalledThisTurn = true;  // Google検索リンクを出さないようにする
    const calls = msg.toolCall.functionCalls || [];
    // ★ 改善: 複数ツール呼び出しを Promise.all で並列実行
    const responses = await Promise.all(calls.map(async (call) => {
      let output = '情報を取得できませんでした。';
      try {
        if (call.name === 'get_current_weather') {
          appendBubble(`🌤 天気情報を取得中…（${call.args?.location}）`, 'system');
          const wxResult = await fetchWeather(call.args?.location || '東京', call.args?.date || 'today');
          output = wxResult.text;
          console.info('[weather]', output);
          // ターン完了後に天気カードリンクをキューに積む（気象庁データ）
          if (wxResult.blobUrl && output && !output.includes('失敗') && !output.includes('見つかりません')) {
            const isTomorrow = (call.args?.date === 'tomorrow');
            const isWeekly = (call.args?.date === 'weekly');
            const weatherLabel = isWeekly ? '📅 気象庁の週間天気予報を見る'
              : isTomorrow ? '🌤 気象庁で明日の天気予報を見る' : '🌤 気象庁で今日の天気予報を見る';
            pendingLinks.push({
              text: weatherLabel,
              url: wxResult.blobUrl,
              embedUrl: null
            });
          }
        } else if (call.name === 'get_current_datetime') {
          const now = new Date();
          const days = ['日','月','火','水','木','金','土'];
          const pad = n => String(n).padStart(2, '0');
          output = `現在の日時: ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${days[now.getDay()]}）` +
                   ` ${pad(now.getHours())}時${pad(now.getMinutes())}分${pad(now.getSeconds())}秒`;
          console.info('[datetime]', output);
        } else if (call.name === 'get_train_status') {
          const trainLine = call.args?.railway || null;
          appendBubble(`🚃 交通情報を取得中…`, 'system');
          output = await fetchTrainStatus(trainLine);
          console.info('[train]', output);
          // 成否にかかわらず Yahoo路線情報リンクを常に表示
          const yahooTrainUrl = trainLine
            ? `https://transit.yahoo.co.jp/traininfo/top`
            : `https://transit.yahoo.co.jp/traininfo/top`;
          pendingLinks.push({ text: '🚃 Yahoo!路線情報で運行状況を確認する', url: yahooTrainUrl, embedUrl: null });
          // ODPT失敗時はリンク誘導メッセージに差し替え
          if (output && (output.includes('エラー') || output.includes('失敗') || output.includes('未設定') || output.includes('通信エラー'))) {
            output = `運行情報の直接取得ができませんでした。リンクからYahoo!路線情報でご確認ください。`;
          }
        } else if (call.name === 'get_next_trains') {
          const ntStation = call.args?.station || '';
          const ntDest    = call.args?.to_station || '';
          appendBubble(`🚃 時刻表を取得中…（${ntStation}駅）`, 'system');
          // 常にリンクを表示（Yahoo時刻表 + Googleマップルート）
          const ytUrl = `https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent(ntStation)}&to=${encodeURIComponent(ntDest || ntStation)}&type=1`;
          pendingLinks.push({ text: `🚃 Yahoo!乗換案内で${ntStation}駅の次の電車を確認する`, url: ytUrl, embedUrl: null });
          if (ntDest) {
            const gmUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(ntStation + '駅')}&destination=${encodeURIComponent(ntDest + '駅')}&travelmode=transit&hl=ja`;
            pendingLinks.push({ text: `🗺 Google マップで${ntStation}→${ntDest}の乗換案内を見る`, url: gmUrl, embedUrl: null });
          }
          output = ntDest
            ? `${ntStation}から${ntDest}への次の電車はリンクからご確認ください。`
            : `${ntStation}駅の次の電車はリンクからご確認ください。`;
          console.info('[timetable]', output);
        } else if (call.name === 'get_places') {
          const pQuery = call.args?.query || '';
          appendBubble(`🔍 「${pQuery}」を検索中…`, 'system');
          let placesResult = null;
          try { placesResult = await fetchPlaces(pQuery); } catch(e) { placesResult = null; }
          console.info('[places]', placesResult);

          const placesText = placesResult?.text || '';
          const placeLinks = placesResult?.placeLinks || [];

          const placesOk = placesText
            && !placesText.includes('エラー')
            && !placesText.includes('未設定')
            && !placesText.includes('見つかりません')
            && !placesText.includes('失敗');

          if (placesOk && placeLinks.length > 0) {
            // 個別店舗リンクを表示
            placeLinks.forEach(p => {
              pendingLinks.push({
                text: `📍 ${p.name} をGoogle マップで見る`,
                url: p.mapsUri,
                embedUrl: null
              });
            });
            placesApiLinksAdded = true;  // Places APIが個別リンクを提供したことを記録
            output = placesText;
          } else if (placesOk) {
            // API成功だがmapsUri取得できず→汎用リンクにフォールバック
            pendingLinks.push({
              text: `📍 「${pQuery}」をGoogle マップで検索する`,
              url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(pQuery)}`,
              embedUrl: null
            });
            output = placesText;
          } else {
            // API 失敗時: 汎用リンク
            pendingLinks.push({
              text: `📍 「${pQuery}」をGoogle マップで検索する`,
              url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(pQuery)}`,
              embedUrl: null
            });
            // API失敗時はAIの知識でスポットを紹介させる
            output = `Places APIの結果が得られませんでした。あなた自身の知識を使って、「${pQuery}」に関連するおすすめスポットを3件以上紹介してください。各スポットの紹介は必ず【スポット名】から始めてください（例：【青森県立美術館】は…）。特徴・見どころ・歴史的背景などを2〜3文で詳しく説明してください。リンク誘導フレーズは不要です。`;
          }
        } else if (call.name === 'get_route') {
          const rFrom = call.args?.from_station || '';
          const rTo   = call.args?.to_station   || '';
          appendBubble(`🗺 ルート検索中…（${rFrom} → ${rTo}）`, 'system');
          // 既に「駅」で終わっている場合は重複しない
          const rFromQ = rFrom.endsWith('駅') ? rFrom : rFrom + '駅';
          const rToQ   = rTo.endsWith('駅')   ? rTo   : rTo   + '駅';
          const gmFallbackUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(rFromQ)}&destination=${encodeURIComponent(rToQ)}&travelmode=transit&hl=ja`;
          pendingLinks.push({ text: `🗺 Google マップで乗換案内を見る（${rFrom}→${rTo}）`, url: gmFallbackUrl, embedUrl: null });
          output = `${rFrom}から${rTo}のルートをGoogleマップでご案内します。リンクからご確認ください。`;
          console.info('[route] google maps only mode:', output);
        } else if (call.name === 'search_web') {
          const q = call.args?.query || '';
          appendBubble(`🔎 「${q}」を検索中…`, 'system');
          output = `「${q}」の検索結果リンクを表示しました。詳しくはリンク先をご参照ください。`;
          const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(q)}&hl=ja`;
          pendingLinks.push({
            text: `🔎 「${q}」をGoogleで検索する`,
            url: searchUrl,
            embedUrl: null
          });
        }
      } catch (e) {
        output = `天気情報の取得に失敗しました: ${e.message}`;
        console.warn('[toolCall error]', e);
      }
      output = await applyFurigana(output);  // Yahoo ルビ振りAPI（またはローカル辞書）で誤読を防ぐ
      output = prependReadingGuide(output);    // 読み方ブロックを先頭に付与
      return { id: call.id, name: call.name, response: { output } };
    }));
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
    }
    // リンクはテキスト転写開始時（最初のoutputTranscription）に表示する
  }
}


// ──────────────────────────────────────────────────
//  吹き出しの【スポット名】順にリンクを並べて表示
// ──────────────────────────────────────────────────
function showLinksOrdered() {
  if (transcriptionDoneTimer !== null) { clearTimeout(transcriptionDoneTimer); transcriptionDoneTimer = null; }
  // すでに表示済みならスキップ
  if (placesApiLinksAdded && pendingLinks.length === 0) return;

  const _bubbles = chatEl.querySelectorAll('.row.assistant .bubble');
  if (_bubbles.length === 0) return;
  const _b = _bubbles[_bubbles.length - 1];
  const _text = _b.textContent;

  // 【スポット名】の登場順を取得
  const _spotNames = [..._text.matchAll(/【([^】]{2,20})】/g)].map(m => m[1]);
  const _usedIdx = new Set();
  const _ordered = [];

  _spotNames.forEach(name => {
    if (streamingSpotLinks.has(name)) return; // streaming で既出力済み
    let bestIdx = -1, bestScore = 0;
    pendingLinks.forEach((lnk, i) => {
      if (_usedIdx.has(i) || !lnk.text.startsWith('📍')) return;
      const lnkName = lnk.text.replace(/^📍\s*/, '').replace(/\s*をGoogle マップで見る$/, '');
      const score = lnkName.includes(name) || name.includes(lnkName) ? 2
                  : [...name].filter(c => lnkName.includes(c)).length;
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    });
    if (bestIdx !== -1 && bestScore > 0) {
      _usedIdx.add(bestIdx);
      _ordered.push(pendingLinks[bestIdx]);
    } else {
      _ordered.push({
        text: `📍 ${name} をGoogle マップで見る`,
        url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`,
        embedUrl: null
      });
    }
    streamingSpotLinks.add(name);
  });

  // 非スポットリンク（ルート・検索等）を末尾に追加
  pendingLinks.forEach((lnk, i) => {
    if (!_usedIdx.has(i) && !lnk.text.startsWith('📍')) _ordered.push(lnk);
  });

  // 【】・ふりがな除去 → リンク表示
  _b.textContent = _text.replace(/【([^】]+)】/g, '$1').replace(/（[ぁ-ん]+）/g, '');
  _ordered.forEach(lnk => appendBubbleWithLinks([lnk], 'system'));
  pendingLinks = [];
  placesApiLinksAdded = true;
}

// ──────────────────────────────────────────────────
//  ユーザー発言の誤変換を Gemini REST API で補正
// ──────────────────────────────────────────────────
async function correctTranscription(bubbleEl, rawText) {
  if (!rawText || rawText.trim().length < 3) return; // 短すぎる場合はスキップ
  const key = apiKeyEl.value.trim() || localStorage.getItem(STORAGE_KEY) || '';
  if (!key) return;
  try {
    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${encodeURIComponent(key)}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text:
            `以下は日本語の音声認識（自動文字起こし）の結果です。誤変換・誤字があれば修正し、正しい日本語1文だけを返してください。説明・引用符・記号は不要です。\n音声認識結果: ${rawText.trim()}`
          }]}],
          generationConfig: { maxOutputTokens: 80, temperature: 0.0 }
        })
      }
    );
    if (!resp.ok) return;
    const data = await resp.json();
    const corrected = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if (corrected && corrected !== rawText.trim() && corrected.length > 0 && corrected.length < rawText.length * 3) {
      // 修正前テキストをtooltipとして残し、表示を更新
      bubbleEl.textContent = corrected;
      bubbleEl.title = `音声認識: ${rawText.trim()}`;
      bubbleEl.style.borderBottom = '1.5px dashed #9e9e9e';
      scrollBottom();
      console.info('[correction]', rawText, '→', corrected);
    }
  } catch (e) {
    // サイレントエラー（補正失敗時は元テキストのまま）
    console.warn('[correction error]', e.message);
  }
}

// テキストメッセージ送信
function sendToGemini(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  // Gemini 3.1: テキスト入力は realtimeInput を使用
  ws.send(JSON.stringify({
    realtimeInput: { text }
  }));
}

function doDisconnect() {
  stopCapture();
  stopPlayback();
  if (ws) { try { ws.close(); } catch {} ws = null; }
  startBtn.disabled    = false;
  hangupBtn.disabled   = true;
  textInputEl.disabled = true;
  sendBtnEl.disabled   = true;
  pendingBubble        = null;
  pendingLinks          = [];
  streamingSpotLinks    = new Set();
  if (transcriptionDoneTimer !== null) { clearTimeout(transcriptionDoneTimer); transcriptionDoneTimer = null; }
  isGreeted            = false;
  greetingComplete     = false;
  if (greetingRetryTimer !== null) { clearTimeout(greetingRetryTimer); greetingRetryTimer = null; }
  userSpokeInTurn      = false;
  sessionActive        = false;
  googleLinkScheduled  = false;
  toolCalledThisTurn   = false;
  lastUserQuery        = '';
  lastInputWasText     = false;
  apiRowEl.style.display = '';
  setStatus('未接続');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  テキスト送信
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function sendText() {
  const text = textInputEl.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    appendBubble('接続されていません。先に「会話開始」を押してください。', 'system');
    return;
  }
  appendBubble(text, 'user');
  lastUserQuery = text;  // テキスト入力をGoogle検索用に記録
  userSpokeInTurn = true;  // テキスト入力もターン内発話として扱う
  lastInputWasText = true;  // テキスト入力フラグ
  toolCalledThisTurn = false;  // 新しいユーザーターン開始: リセット
  sendToGemini(text);
  textInputEl.value = '';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  音声オン/オフ
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function setVoice(on) {
  voiceOn = on;
  voiceSwitchEl.classList.toggle('on', on);
  voiceSwitchEl.setAttribute('aria-checked', String(on));
  voiceLabelEl.textContent = on ? '音声オン' : '音声オフ';
  if (!on) stopPlayback();
  // マイクも連動
  if (mediaStream) {
    mediaStream.getAudioTracks().forEach(t => { t.enabled = on; });
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  イベントリスナー
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
startBtn.addEventListener('click', async () => {
  const key = apiKeyEl.value.trim();
  if (!key) {
    alert('Gemini API キーを入力してください。\nGoogle AI Studio (https://aistudio.google.com) で取得できます。');
    return;
  }
  localStorage.setItem(STORAGE_KEY, key);
  const placesKey = document.getElementById('placesKey').value.trim();
  if (placesKey) localStorage.setItem(PLACES_STORAGE_KEY, placesKey);
  const yahooKey = document.getElementById('yahooKey').value.trim();
  if (yahooKey) localStorage.setItem(YAHOO_STORAGE_KEY, yahooKey);
  // AudioContext をユーザー操作中（クリックイベント内）に事前生成し
  // 無音バッファを再生してブラウザのオートプレイ制限を確実に解除する
  try {
    const ctx = ensurePlayCtx();
    const silentBuf = ctx.createBuffer(1, 1, ctx.sampleRate);
    const silentSrc = ctx.createBufferSource();
    silentSrc.buffer = silentBuf;
    silentSrc.connect(ctx.destination);
    silentSrc.start(0);
  } catch (_) {}

  startBtn.disabled = true;
  try {
    await validateApiKey(key);   // ① REST で認証チェック
    connect(key);                // ② WebSocket 接続
  } catch (err) {
    appendBubble(`接続できませんでした:\n${err.message}`, 'system');
    startBtn.disabled = false;
    setStatus('未接続');
  }
});

hangupBtn.addEventListener('click', doDisconnect);

// 会話クリアボタン
$('#clearChat').addEventListener('click', () => {
  if (!confirm('会話履歴をクリアしますか？')) return;
  document.getElementById('chat').innerHTML = '';
  pendingBubble     = null;
  pendingUserBubble = null;
  lastUserQuery     = '';
});


voiceSwitchEl.addEventListener('click', () => setVoice(!voiceOn));
voiceSwitchEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setVoice(!voiceOn); }
});

sendBtnEl.addEventListener('click', sendText);
textInputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendText(); }
});

// スクロール追従
new MutationObserver(scrollBottom).observe(chatEl, { childList: true, subtree: true, characterData: true });
window.addEventListener('resize', scrollBottom);
textInputEl.addEventListener('focus', scrollBottom);
window.addEventListener('beforeunload', doDisconnect);
</script>
